name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  unittest:
    name: unit + integration tests (python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Byte-compile every module
        run: python3 -m compileall -q cdt tests

      - name: Run the test suite
        run: python3 -m unittest discover -s tests -t .

      - name: Smoke test the CLI
        run: |
          python3 -m cdt version
          python3 -m cdt --help >/dev/null

  packaging:
    name: packaging
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install the package and check the entry point
        run: |
          python3 -m pip install .
          cdt version
          python3 -c "import cdt; print('import ok', cdt.__version__)"
